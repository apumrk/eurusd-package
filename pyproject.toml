[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eurusd-package"
version = "0.1"
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "apumrk", email = "apumrk@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "pandas == 2.2.3",
  "numpy == 1.26.4",
  "statsmodels == 0.14.4",
  "matplotlib == 3.10.0",
  "seaborn == 0.13.2",
  "plotly == 6.0.1",
  "prophet == 1.1.5"
]

[project.urls]
Documentation = "https://github.com/apumrk/eurusd-package#readme"
Issues = "https://github.com/apumrk/eurusd-package/issues"
Source = "https://github.com/apumrk/eurusd-package"

